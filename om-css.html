<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Om CSS</title>
    <!--Exempel på external CSS.-->
    <link rel="stylesheet" type="text/css" href="styles.css">

    <!-- exempel på internal CSS. -->
    <style>
        li {
            background-color: rgb(4, 4, 120); color:rgb(194, 132, 253)
        }

        body {
              background-color: rgb(91, 207, 249);

        }
    </style>
</head>
<body>
    <h1 style="background-color: aqua;">Om CSS</h1><!-- exempel på inline css. -->
    <p>CSS (cascading style sheets) är ett språk som används för att beskriva utseendet och formatering av dokument skrivna i HTML</p>
    <h2>Olika typer av CSS</h2>
    <ul>
        <li>Inline CSS</li>
        <li>Internal CSS</li>
        <li>External CSS</li>
    </ul>

    <p class="warning"> OBS! </p>
    <h2>Typografi</h2>
    <h3 class="sans-serif"> Sans-serif</h3>
    <p class="sans-serif">Sans-serif kkk</p>
    <h3 class="serif">Serif</h3>
    <p class="serif">Serif kkkk</p>

    <h2>
        <p style="color: rgb(1, 1, 94);">MÖRKTBLÅ</p>
        <p style="color: rgba(255, 0, 47, 0.71);">RÖD</p>
        <p style="color: rgb(63, 255, 5);"> GRÖN</p>
        <p style="color: rgb(255, 252, 101);">GUL</p>


    </h2>

</body>
</html>
